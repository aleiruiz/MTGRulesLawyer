<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dd97"/>
      <stop offset="0.55" stop-color="#d8b25a"/>
      <stop offset="1" stop-color="#a87f2c"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43346a"/>
      <stop offset="1" stop-color="#1d1729"/>
    </linearGradient>
  </defs>
  <!-- card frame -->
  <rect x="96" y="36" width="320" height="440" rx="30" fill="#1f1a2b" stroke="url(#gold)" stroke-width="20"/>
  <!-- art window -->
  <rect x="134" y="80" width="244" height="230" rx="12" fill="url(#art)" stroke="#c9a24a" stroke-width="6"/>
  <!-- gavel: head lower right, handle to upper left -->
  <g transform="rotate(42 256 196)">
    <rect x="243" y="66" width="26" height="150" rx="12" fill="url(#gold)" stroke="#5a4214" stroke-width="5"/>
    <rect x="196" y="196" width="120" height="58" rx="16" fill="url(#gold)" stroke="#5a4214" stroke-width="6"/>
    <rect x="184" y="203" width="18" height="44" rx="6" fill="#f6dd97" stroke="#5a4214" stroke-width="5"/>
    <rect x="310" y="203" width="18" height="44" rx="6" fill="#f6dd97" stroke="#5a4214" stroke-width="5"/>
  </g>
  <!-- sounding block -->
  <rect x="160" y="266" width="120" height="24" rx="8" fill="url(#gold)" stroke="#5a4214" stroke-width="5"/>
  <!-- rules text -->
  <rect x="134" y="342" width="244" height="14" rx="7" fill="#c9a24a" opacity="0.8"/>
  <rect x="134" y="378" width="244" height="14" rx="7" fill="#c9a24a" opacity="0.8"/>
  <rect x="134" y="414" width="150" height="14" rx="7" fill="#c9a24a" opacity="0.8"/>
  <!-- gem on the frame -->
  <path d="M256 12 l24 26 -24 26 -24 -26z" fill="#f6dd97" stroke="#5a4214" stroke-width="5"/>
</svg>
