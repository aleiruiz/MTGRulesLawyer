name: Source refresh

# The production server runs the same steps daily (deploy/daily-maintenance.sh, see docs/deploy.md),
# so its database never has to be reachable from GitHub. This manual run is only for a database that is.
on:
  workflow_dispatch:
    inputs:
      force_localized_names:
        description: "Import Spanish card names now instead of waiting for the weekly run"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh and check source freshness
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_STALE_AFTER_HOURS: ${{ vars.SOURCE_STALE_AFTER_HOURS || '72' }}
      AI_GLOBAL_DAILY_COST_LIMIT_MICROS: ${{ vars.AI_GLOBAL_DAILY_COST_LIMIT_MICROS || '5000000' }}
      AI_DAILY_COST_ALERT_MICROS: ${{ vars.AI_DAILY_COST_ALERT_MICROS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply source tracking migrations
        run: pnpm db:migrate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check sources and activate changes
        run: pnpm sources:refresh

      # Reads Scryfall's large every-printing file, so it imports at most once a week unless
      # forced from a manual run (for example right after a new set).
      - name: Refresh Spanish card names (weekly)
        if: ${{ !cancelled() }}
        env:
          FORCE_FLAG: ${{ inputs.force_localized_names && '--force' || '' }}
        run: pnpm cards:localized-names $FORCE_FLAG

      - name: Alert on stale sources or failed refreshes
        if: always()
        run: pnpm sources:check

      - name: Alert on daily AI cost threshold
        if: always()
        run: pnpm ops:ai-usage
