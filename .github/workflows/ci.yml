name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and builds
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mtg_rules:local-dev-only@localhost:5432/mtg_rules_lawyer
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mtg_rules_lawyer
          POSTGRES_USER: mtg_rules
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtg_rules -d mtg_rules_lawyer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check Prisma schema formatting
        run: pnpm db:format && git diff --exit-code -- prisma/schema.prisma

      - name: Typecheck
        run: pnpm typecheck

      - name: Reset and seed PostgreSQL
        run: pnpm db:reset

      - name: Test
        env:
          RUN_DATABASE_INTEGRATION_TESTS: "true"
        run: pnpm test

      - name: Build API
        run: pnpm --filter @mtg-rules/api build

      - name: Validate Expo config
        run: pnpm --filter @mtg-rules/mobile exec expo config --type public

      - name: Export Expo app
        run: pnpm --filter @mtg-rules/mobile build

      - name: Audit dependencies
        run: pnpm audit:check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
